# Local Postgres with pgvector for Deep RAG (v1.1.0)
# Native PG17 on :5432 often lacks the vector extension — use this for local RAG.
#
# Usage:
#   docker compose -f docker-compose.pgvector.yml up -d
#   # Point DATABASE_URL at localhost:5436 (see docs/RELEASE-1.1.0.md)
#   npx tsx scripts/run-migrations.ts
#
# Stop:
#   docker compose -f docker-compose.pgvector.yml down

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: srp-auth-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: srp_auth
      POSTGRES_USER: srp_ats
      POSTGRES_PASSWORD: ats_dev_password
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - srp_auth_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srp_ats -d srp_auth"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  srp_auth_pgvector_data:
    name: srp_auth_pgvector_data
