name: Renew SSL (recruit.srpailabs.com)

# Renew Let's Encrypt cert only. Never restarts Docker daemon.
# Never touches Wellora / SRP website / n8n containers.
on:
  workflow_dispatch:

jobs:
  renew:
    name: Certbot renew + nginx reload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Renew certificate via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          command_timeout: 12m
          script: |
            set -u
            echo "=== Current cert ==="
            sudo openssl x509 -in /etc/letsencrypt/live/recruit.srpailabs.com/fullchain.pem -noout -dates -subject 2>/dev/null \
              || sudo openssl x509 -in /etc/nginx/ssl/recruit.srpailabs.com/fullchain.pem -noout -dates -subject 2>/dev/null \
              || echo "Could not read cert path — will try certbot anyway"

            echo "=== Local app health (HTTP) ==="
            curl -s -o /dev/null -w "local:%{http_code}\n" --max-time 8 http://127.0.0.1:3010/api/health || true

            echo "=== Certbot renew ==="
            if command -v certbot >/dev/null 2>&1; then
              sudo certbot renew --force-renewal --cert-name recruit.srpailabs.com --nginx --non-interactive \
                || sudo certbot renew --force-renewal --nginx --non-interactive \
                || sudo certbot certonly --nginx -d recruit.srpailabs.com --non-interactive --agree-tos --keep-until-expiring \
                || sudo certbot certonly --webroot -w /var/www/html -d recruit.srpailabs.com --non-interactive --agree-tos
            else
              echo "certbot missing"
              exit 1
            fi

            echo "=== Nginx test + reload (not restart docker) ==="
            sudo nginx -t
            sudo systemctl reload nginx

            echo "=== New cert dates ==="
            sudo openssl x509 -in /etc/letsencrypt/live/recruit.srpailabs.com/fullchain.pem -noout -dates -subject 2>/dev/null || true

            echo "=== HTTPS probe from host ==="
            curl -s -o /dev/null -w "https:%{http_code}\n" --max-time 15 https://127.0.0.1/api/health -H "Host: recruit.srpailabs.com" --insecure || true
            curl -s -o /dev/null -w "public:%{http_code}\n" --max-time 15 https://recruit.srpailabs.com/api/health || true

      - name: Verify public HTTPS
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/h.json -w "%{http_code}" --max-time 20 https://recruit.srpailabs.com/api/health || echo 000)
            echo "attempt $i => $CODE"
            if [ "$CODE" = "200" ]; then
              head -c 400 /tmp/h.json; echo
              exit 0
            fi
            sleep 3
          done
          exit 1
