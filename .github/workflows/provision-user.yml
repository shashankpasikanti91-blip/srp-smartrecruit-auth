name: Provision lifelong user (prod)

on:
  workflow_dispatch:
    inputs:
      email:
        description: User email
        required: true
        type: string
      name:
        description: Display name
        required: true
        type: string
      temp_password:
        description: Temporary password (client must change after login)
        required: true
        type: string

jobs:
  provision:
    name: SSH provision on Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Provision via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROVISION_EMAIL: ${{ inputs.email }}
          PROVISION_TEMP_PASSWORD: ${{ inputs.temp_password }}
          PROVISION_NAME: ${{ inputs.name }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          command_timeout: 10m
          envs: PROVISION_EMAIL,PROVISION_TEMP_PASSWORD,PROVISION_NAME
          script: |
            set -euo pipefail
            cd /opt/srp-smartrecruit-auth
            git fetch origin
            git checkout main
            git reset --hard origin/main
            # Host run: pull DATABASE_URL from production .env (compose DB hostname)
            set -a
            # shellcheck disable=SC1091
            . ./.env
            set +a
            # App container uses host "db"; host scripts need 127.0.0.1 mapped port if present
            export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | sed 's|@db:5432/|@127.0.0.1:5432/|g')"
            npx --yes tsx scripts/provision-lifelong-user.ts
