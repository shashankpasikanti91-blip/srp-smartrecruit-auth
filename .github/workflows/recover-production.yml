name: Recover Production (no rebuild)

# Restores the already-built app/db containers after a stuck deploy.
# Does NOT reset the database. Does NOT rebuild images. Does NOT delete uploads.
on:
  workflow_dispatch:

jobs:
  recover:
    name: Bring app back online
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Restore containers via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/srp-smartrecruit-auth

            echo "=== Free disk (logs + dangling images + this app's old images). No Docker daemon restart. ==="
            df -h / || true
            sudo find /var/lib/docker/containers -name '*-json.log' -size +20M -exec truncate -s 0 {} \; 2>/dev/null || true
            docker image prune -f || true
            docker builder prune -af || true
            if [ -d /opt/backups/srp-smartrecruit ]; then
              sudo find /opt/backups/srp-smartrecruit -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + || true
            fi
            sudo journalctl --vacuum-size=80M >/dev/null 2>&1 || true
            docker images 'srp-smartrecruit-auth' --format '{{.ID}} {{.Tag}}' | awk '$2 != "latest" {print $1}' | sort -u | xargs -r docker rmi -f || true
            df -h / || true

            echo "=== Recover ONLY srp-auth-db + srp-auth-app (never restart Docker daemon) ==="
            # FORBIDDEN: systemctl restart docker — Wellora / SRP site / n8n / mediflow share this host.
            docker start srp-auth-db 2>/dev/null || docker compose up -d --no-build db || true
            for i in $(seq 1 30); do
              if docker exec srp-auth-db pg_isready -U srp_auth -d srp_auth >/dev/null 2>&1; then
                echo "srp-auth-db ready (attempt $i)"
                break
              fi
              echo "  waiting for srp-auth-db $i/30"
              sleep 4
            done
            echo "=== Start existing app image (no rebuild, no other compose projects) ==="
            docker start srp-auth-app 2>/dev/null || docker compose up -d --no-build --no-deps app || true
            sleep 5

            echo "=== Container status ==="
            docker compose ps || true
            docker images 'srp-smartrecruit-auth*' --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.CreatedSince}}' || true

            echo "=== Health loop ==="
            HEALTHY=0
            for i in $(seq 1 40); do
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:3010/api/health 2>/dev/null || echo "000")
              if [ "$HTTP" = "200" ]; then
                echo "Recovered — healthy on attempt $i"
                HEALTHY=1
                break
              fi
              echo "  attempt $i/40 HTTP=$HTTP"
              if [ "$i" = "10" ] || [ "$i" = "20" ]; then
                echo "--- app logs ---"
                docker logs srp-auth-app --tail 40 || true
                docker compose up -d --no-build || true
              fi
              sleep 4
            done

            if [ "$HEALTHY" != "1" ]; then
              echo "Recovery failed — last app logs:"
              docker logs srp-auth-app --tail 120 || true
              docker compose ps -a || true
              exit 1
            fi

            sudo systemctl reload nginx 2>/dev/null || true
            echo "=== Recovery complete (tenant data preserved) ==="

      - name: Verify HTTPS health
        run: |
          for i in $(seq 1 25); do
            CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 25 https://recruit.srpailabs.com/api/health || echo 000)
            echo "HTTPS health attempt $i => $CODE"
            if [ "$CODE" = "200" ]; then
              head -c 500 /tmp/health.json; echo
              exit 0
            fi
            sleep 5
          done
          echo "HTTPS health never returned 200"
          exit 1
