name: CI Security Gates

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/**"
      - "db/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/**"
      - "db/**"
      - "package.json"
      - "package-lock.json"

jobs:
  security-gates:
    name: Typecheck Lint Unit Secret Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit security + RAG fixture eval
        run: |
          npm run test:unit
          npm run test:rag-eval

      - name: Secret pattern scan (blocking)
        run: |
          if git grep -I -E 'sk-or-v1-[A-Za-z0-9]{20,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY' -- ':!*.md' ':!*.template' ':!**/.env.example'; then
            echo "Possible secret in tracked files"
            exit 1
          fi
          echo "Secret pattern scan passed"

      - name: npm audit (critical — blocking)
        run: npm audit --audit-level=critical --legacy-peer-deps

      - name: npm audit (high — report only)
        continue-on-error: true
        run: npm audit --audit-level=high --legacy-peer-deps
