name: Deploy Frontend (Next.js Auth)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ΓöÇΓöÇ 1. Type-check & build locally to catch errors before SSH ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
  build-check:
    name: Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (verify it compiles)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # Stub required secrets so next build doesn't abort
          NEXTAUTH_SECRET: ci-stub-not-used
          NEXTAUTH_URL: https://recruit.srpailabs.com
        run: npm run build

  # ΓöÇΓöÇ 2. Deploy to Hetzner & E2E ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
  deploy:
    name: Deploy & E2E
    runs-on: ubuntu-latest
    needs: build-check
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose SSH secrets
        run: |
          echo "HETZNER_HOST set: ${{ secrets.HETZNER_HOST != '' && 'YES' || 'NO - MISSING SECRET' }}"
          echo "HETZNER_USER set: ${{ secrets.HETZNER_USER != '' && 'YES' || 'NO - MISSING SECRET' }}"
          echo "HETZNER_SSH_KEY set: ${{ secrets.HETZNER_SSH_KEY != '' && 'YES' || 'NO - MISSING SECRET' }}"
          echo "PRODUCTION_ENV set: ${{ secrets.PRODUCTION_ENV != '' && 'YES' || 'NO - MISSING SECRET' }}"
          HOST="${{ secrets.HETZNER_HOST }}"
          if [ -n "$HOST" ]; then
            nc -z -w10 "$HOST" 22 && echo "Port 22 REACHABLE" || echo "Port 22 NOT REACHABLE from GitHub runner"
          else
            echo "Cannot test - HETZNER_HOST is empty"
          fi

      - name: Deploy Next.js to Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          FRONTEND_ENV: ${{ secrets.PRODUCTION_ENV }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          envs: FRONTEND_ENV
          script: |
            set -euo pipefail
            cd /opt/srp-smartrecruit-auth

            echo "=== [1/5] Pull latest code (main) ==="
            git fetch origin
            git checkout main
            git reset --hard origin/main
            git clean -fd -e uploads -e .env

            echo "=== [1b/5] Pre-deploy backup (DB + uploads) ==="
            if [ -x /usr/local/bin/srp-backup ]; then
              sudo /usr/local/bin/srp-backup || echo "WARN: backup script returned non-zero — continuing deploy"
            else
              echo "WARN: /usr/local/bin/srp-backup not installed — skipping pre-deploy backup"
            fi

            echo "=== [2/5] Write .env from secret ==="
            printf '%s\n' "$FRONTEND_ENV" > /opt/srp-smartrecruit-auth/.env
            chmod 600 /opt/srp-smartrecruit-auth/.env
            # Always enforce correct NEXTAUTH_URL
            sed -i 's|NEXTAUTH_URL=.*|NEXTAUTH_URL=https://recruit.srpailabs.com|' /opt/srp-smartrecruit-auth/.env
            grep -q 'NEXTAUTH_URL' /opt/srp-smartrecruit-auth/.env || echo 'NEXTAUTH_URL=https://recruit.srpailabs.com' >> /opt/srp-smartrecruit-auth/.env
            # Force correct DATABASE_URL (docker-compose needs it in env_file, not environment block)
            sed -i '/^DATABASE_URL=/d' /opt/srp-smartrecruit-auth/.env
            echo 'DATABASE_URL=postgresql://srp_auth:SrpAuth2024Secure!@db:5432/srp_auth' >> /opt/srp-smartrecruit-auth/.env
            sed -i '/^POSTGRES_PASSWORD=/d' /opt/srp-smartrecruit-auth/.env
            echo 'POSTGRES_PASSWORD=SrpAuth2024Secure!' >> /opt/srp-smartrecruit-auth/.env
            echo "DB URL injected, POSTGRES_PASSWORD set"

            echo "=== [2b/5] Run DB migrations ==="
            # Run all migrations idempotently (IF NOT EXISTS / ON CONFLICT safe)
            docker exec -i srp-auth-db psql -U srp_auth -d srp_auth \
              < /opt/srp-smartrecruit-auth/db/migrate_v10_candidate_record_optional_jd.sql
            docker exec -i srp-auth-db psql -U srp_auth -d srp_auth \
              < /opt/srp-smartrecruit-auth/db/migrate_v11_dup_index.sql
            # Ensure password_hash column and user passwords are set (idempotent)
            docker exec -i srp-auth-db psql -U srp_auth -d srp_auth \
              < /opt/srp-smartrecruit-auth/db/migrate_v12_fix_passwords.sql
            # v12: resume_original_path column for in-app file preview
            docker exec -i srp-auth-db psql -U srp_auth -d srp_auth \
              < /opt/srp-smartrecruit-auth/db/migrate_v12_resume_original.sql
            # v13: retention_exempt flag on tenants
            docker exec -i srp-auth-db psql -U srp_auth -d srp_auth \
              < /opt/srp-smartrecruit-auth/db/migrate_v13_tenant_retention_exempt.sql
            for f in migrate_v0_schema_migrations.sql \
                     migrate_v14_candidate_documents.sql \
                     migrate_v15_workflow.sql \
                     migrate_v16_ess_lite.sql \
                     migrate_v17_submission_history.sql \
                     migrate_v18_offer_history.sql \
                     migrate_v19_ess_full.sql \
                     migrate_v20_governance.sql \
                     migrate_v21_ess_approval_audit.sql; do
              if [ -f "/opt/srp-smartrecruit-auth/db/$f" ]; then
                echo "==> $f"
                docker exec -i srp-auth-db psql -U srp_auth -d srp_auth \
                  < "/opt/srp-smartrecruit-auth/db/$f"
              else
                echo "SKIP missing migration file: $f"
              fi
            done
            echo "--- Verifying user password status ---"
            docker exec srp-auth-db psql -U srp_auth -d srp_auth -c \
              "SELECT email, is_active, (password_hash IS NOT NULL) AS has_password FROM auth_users WHERE email IN ('demo@srpailabs.com','pasikantishashank24@gmail.com','hareesh4u22@gmail.com','priyapasikanti0@gmail.com') ORDER BY email;"

            echo "=== [3/5] Stop app only ΓÇö DB stays running ==="
            docker compose stop app  2>/dev/null || true
            docker compose rm -f app 2>/dev/null || true

            echo "=== [4/5] Rebuild Docker image (no cache) ==="
            docker compose build --no-cache app

            echo "=== [5/5] Start & health-check ==="
            docker compose up -d
            HEALTHY=0
            for i in $(seq 1 25); do
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3010/api/health 2>/dev/null || echo "000")
              if [ "$HTTP" = "200" ]; then
                echo "Γ£à Next.js healthy (attempt $i)"
                HEALTHY=1; break
              fi
              echo "   Attempt $i/25 ΓÇö HTTP $HTTP"
              sleep 4
            done
            [ "$HEALTHY" -eq 1 ] || { echo "Γ¥î Next.js never became healthy"; exit 1; }

            sudo systemctl reload nginx 2>/dev/null || true
            docker image prune -f 2>/dev/null || true

            echo "=== [5b/5] Update nginx config ==="
            # Push latest nginx config so auth routes are correctly proxied to Next.js
            NGINX_CONF="/etc/nginx/sites-available/recruit.srpailabs.com"
            if [ -f "$NGINX_CONF" ]; then
              cp /opt/srp-smartrecruit-auth/deployment/recruit.srpailabs.com.nginx "$NGINX_CONF"
              nginx -t 2>&1 && sudo systemctl reload nginx && echo "Γ£à Nginx config updated" \
                || echo "ΓÜá∩╕Å Nginx config test failed ΓÇö keeping old config"
            else
              echo "ΓÜá∩╕Å Nginx site config not found at $NGINX_CONF ΓÇö skipping update"
            fi

            echo "Γ£à Frontend deploy complete"

      # ΓöÇΓöÇ E2E: HTTP checks against live HTTPS domain (no SSH needed) ΓöÇΓöÇ
      - name: Run HTTPS E2E checks
        run: |
          python3 - << 'PYEOF'
          import ssl, sys, time, urllib.request, urllib.error

          CTX = ssl.create_default_context()
          BASE = "https://recruit.srpailabs.com"
          failures = []

          def get(path, expect):
              code = None; err = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          BASE + path, headers={"User-Agent": "SRP-E2E/2.0"}
                      )
                      with urllib.request.urlopen(req, context=CTX, timeout=15) as r:
                          code = r.status
                      break
                  except urllib.error.HTTPError as e:
                      code = e.code; break
                  except Exception as e:
                      err = str(e)
                      if attempt < 2: time.sleep(3); continue
              if code is None:
                  print(f"  [FAIL] {path} -> {err}"); failures.append(path); return
              expected = expect if isinstance(expect, (list, tuple)) else [expect]
              ok = code in expected
              print(f"  [{'PASS' if ok else 'FAIL'}] {path} <- HTTP {code}")
              if not ok:
                  failures.append(f"{path} (got {code}, expected {expected})")

          print("\n=== SRP SmartRecruit HTTPS E2E ===")
          get("/health",                200)
          get("/",                      [200, 307, 308])
          get("/login",                 [200, 307, 308])
          get("/signup",                [200, 307, 308])
          get("/api/auth/csrf",         200)
          get("/api/auth/providers",    200)
          get("/api/auth/me",           [400, 401, 403, 405])
          get("/api/resume/list",       [401, 403, 405])
          get("/api/support/tickets",   [401, 403, 405])
          get("/api/screening/results", [401, 403, 405])

          print(f"\n{'Γ£à All checks passed!' if not failures else 'Γ¥î FAILED: ' + str(failures)}")
          sys.exit(1 if failures else 0)
          PYEOF
