name: Deploy Frontend (Next.js Auth)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ╬ô├╢├ç╬ô├╢├ç 1. Type-check & build locally to catch errors before SSH ╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç
  build-check:
    name: Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (verify it compiles)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          # Stub required secrets so next build doesn't abort
          NEXTAUTH_SECRET: ci-stub-not-used
          NEXTAUTH_URL: https://recruit.srpailabs.com
        run: npm run build

  # ╬ô├╢├ç╬ô├╢├ç 2. Deploy to Hetzner & E2E ╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç╬ô├╢├ç
  deploy:
    name: Deploy & E2E
    runs-on: ubuntu-latest
    needs: build-check
    timeout-minutes: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose SSH secrets
        run: |
          echo "HETZNER_HOST set: ${{ secrets.HETZNER_HOST != '' && 'YES' || 'NO - MISSING SECRET' }}"
          echo "HETZNER_USER set: ${{ secrets.HETZNER_USER != '' && 'YES' || 'NO - MISSING SECRET' }}"
          echo "HETZNER_SSH_KEY set: ${{ secrets.HETZNER_SSH_KEY != '' && 'YES' || 'NO - MISSING SECRET' }}"
          echo "PRODUCTION_ENV set: ${{ secrets.PRODUCTION_ENV != '' && 'YES' || 'NO - MISSING SECRET' }}"
          HOST="${{ secrets.HETZNER_HOST }}"
          if [ -n "$HOST" ]; then
            nc -z -w10 "$HOST" 22 && echo "Port 22 REACHABLE" || echo "Port 22 NOT REACHABLE from GitHub runner"
          else
            echo "Cannot test - HETZNER_HOST is empty"
          fi

      - name: Deploy Next.js to Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          FRONTEND_ENV: ${{ secrets.PRODUCTION_ENV }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          command_timeout: 70m
          envs: FRONTEND_ENV
          script: |
            set -euo pipefail
            cd /opt/srp-smartrecruit-auth

            echo "=== [0/5] Ensure ONLY srp-auth containers (never restart Docker daemon) ==="
            # FORBIDDEN on this host: systemctl restart docker / docker restart
            # Other stacks share the daemon: Wellora, SRP marketing site, n8n, mediflow, srp-ats.
            # This compose project is only srp-auth-db + srp-auth-app.
            docker start srp-auth-db 2>/dev/null || docker compose up -d --no-build db || true
            for i in $(seq 1 30); do
              if docker exec srp-auth-db pg_isready -U srp_auth -d srp_auth >/dev/null 2>&1; then
                echo "srp-auth-db ready (attempt $i)"
                break
              fi
              echo "  waiting for srp-auth-db $i/30"
              sleep 4
            done
            docker start srp-auth-app 2>/dev/null || docker compose up -d --no-build --no-deps app || true
            HTTP_NOW=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:3010/api/health || true)
            echo "App health before deploy: ${HTTP_NOW:-000}"

            echo "=== [1/5] Pull latest code (main) ==="
            git fetch origin
            git checkout main
            git reset --hard origin/main
            git clean -fd -e uploads -e .env

            echo "=== [1b/5] Pre-deploy backup (DB + uploads) ΓÇö REQUIRED ==="
            # Install/refresh backup helper from repo (additive; never deletes tenants)
            sudo cp /opt/srp-smartrecruit-auth/scripts/srp-backup.sh /usr/local/bin/srp-backup
            sudo chmod +x /usr/local/bin/srp-backup
            if [ "${ALLOW_DEPLOY_WITHOUT_BACKUP:-0}" = "1" ]; then
              sudo /usr/local/bin/srp-backup || echo "WARN: backup failed but ALLOW_DEPLOY_WITHOUT_BACKUP=1"
            else
              sudo /usr/local/bin/srp-backup
            fi

            echo "=== [2/5] Write .env from secret ==="
            printf '%s\n' "$FRONTEND_ENV" > /opt/srp-smartrecruit-auth/.env
            chmod 600 /opt/srp-smartrecruit-auth/.env
            # Always enforce correct NEXTAUTH_URL
            sed -i 's|NEXTAUTH_URL=.*|NEXTAUTH_URL=https://recruit.srpailabs.com|' /opt/srp-smartrecruit-auth/.env
            grep -q 'NEXTAUTH_URL' /opt/srp-smartrecruit-auth/.env || echo 'NEXTAUTH_URL=https://recruit.srpailabs.com' >> /opt/srp-smartrecruit-auth/.env
            # Credentials MUST come from PRODUCTION_ENV (FRONTEND_ENV) — never hardcode in CI
            if ! grep -q '^DATABASE_URL=' /opt/srp-smartrecruit-auth/.env; then
              echo "ERROR: DATABASE_URL missing from PRODUCTION_ENV secret"
              exit 1
            fi
            if ! grep -q '^POSTGRES_PASSWORD=' /opt/srp-smartrecruit-auth/.env; then
              echo "ERROR: POSTGRES_PASSWORD missing from PRODUCTION_ENV secret"
              exit 1
            fi
            # Ensure compose can reach the DB container by hostname "db"
            sed -i 's|@127.0.0.1:5432/|@db:5432/|g; s|@localhost:5432/|@db:5432/|g' /opt/srp-smartrecruit-auth/.env || true
            echo "DB URL present in env (value not logged)"

            echo "=== [2b/5] Run DB migrations (additive; preserve tenants + logins) ==="
            # Legacy early patches (idempotent ALTER/ADD COLUMN)
            for f in migrate_v10_candidate_record_optional_jd.sql \
                     migrate_v11_dup_index.sql \
                     migrate_v12_fix_passwords.sql \
                     migrate_v12_resume_original.sql \
                     migrate_v13_tenant_retention_exempt.sql; do
              if [ -f "/opt/srp-smartrecruit-auth/db/$f" ]; then
                echo "==> $f"
                docker exec -i srp-auth-db psql -U srp_auth -d srp_auth -v ON_ERROR_STOP=1 \
                  < "/opt/srp-smartrecruit-auth/db/$f"
              fi
            done
            # Tracked OS migrations v0 + v14–v32 (auth_users count must stay stable)
            chmod +x /opt/srp-smartrecruit-auth/scripts/apply-tracked-migrations.sh
            APP_DIR=/opt/srp-smartrecruit-auth /opt/srp-smartrecruit-auth/scripts/apply-tracked-migrations.sh

            echo "--- Verifying login accounts still active ---"
            docker exec srp-auth-db psql -U srp_auth -d srp_auth -c \
              "SELECT email, is_active, (password_hash IS NOT NULL) AS has_password FROM auth_users WHERE email IN ('demo@srpailabs.com','pasikantishashank24@gmail.com','hareesh4u22@gmail.com','priyapasikanti0@gmail.com') ORDER BY email;"

            echo "=== [3/5] Build app image (DB stays up; keep serving until recreate) ==="
            # Do NOT stop app before build — previous timeout left site 502
            # Bound build so a hung daemon fails the step instead of eating the whole SSH session
            timeout 55m docker compose build app

            echo "=== [4/5] Recreate app container only ==="
            timeout 180 docker compose up -d --no-deps --force-recreate app
            timeout 120 docker compose up -d --no-build || timeout 180 docker compose up -d

            echo "=== [5/5] Start & health-check ==="
            HEALTHY=0
            for i in $(seq 1 40); do
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3010/api/health 2>/dev/null || echo "000")
              if [ "$HTTP" = "200" ]; then
                echo "Next.js healthy (attempt $i)"
                HEALTHY=1; break
              fi
              echo "   Attempt $i/40 ΓÇö HTTP $HTTP"
              sleep 4
            done
            [ "$HEALTHY" -eq 1 ] || { echo "Next.js never became healthy"; docker logs srp-auth-app --tail 80 || true; exit 1; }

            sudo systemctl reload nginx 2>/dev/null || true
            docker image prune -f 2>/dev/null || true

            echo "=== [5b/5] Update nginx config (recruit.srpailabs.com vhost only) ==="
            NGINX_CONF="/etc/nginx/sites-available/recruit.srpailabs.com"
            if [ -f "$NGINX_CONF" ]; then
              sudo cp /opt/srp-smartrecruit-auth/deployment/recruit.srpailabs.com.nginx "$NGINX_CONF"
              if sudo nginx -t 2>&1; then
                sudo systemctl reload nginx
                echo "Nginx recruit.srpailabs.com vhost updated"
              else
                echo "Nginx config test failed — keeping previous vhost"
              fi
            else
              echo "Nginx site config not found at $NGINX_CONF — skipping"
            fi

            echo "=== [5c/5] Owner Telegram: deploy live ==="
            ENVF=/opt/srp-smartrecruit-auth/.env
            if [ -f "$ENVF" ]; then
              TOKEN=$(grep -E '^TELEGRAM_BOT_TOKEN=' "$ENVF" | cut -d= -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
              CHAT=$(grep -E '^TELEGRAM_CHAT_ID=' "$ENVF" | cut -d= -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
              if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
                curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
                  --data-urlencode "chat_id=${CHAT}" \
                  --data-urlencode "text=SmartRecruit LIVE: AI Screening parse/single/bulk fix deployed. Other Docker projects were not touched. https://recruit.srpailabs.com" \
                  >/dev/null || echo "Telegram notify skipped"
              else
                echo "Telegram env not set in .env — owner will not get deploy ping"
              fi
            fi

            echo "Frontend deploy complete"

      # ╬ô├╢├ç╬ô├╢├ç E2E: HTTP checks against live HTTPS domain (no SSH needed) ╬ô├╢├ç╬ô├╢├ç
      - name: Run HTTPS E2E checks
        run: |
          python3 - << 'PYEOF'
          import ssl, sys, time, urllib.request, urllib.error

          CTX = ssl.create_default_context()
          BASE = "https://recruit.srpailabs.com"
          failures = []

          def get(path, expect):
              code = None; err = None; body = b""
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(
                          BASE + path, headers={"User-Agent": "SRP-E2E/2.0"}
                      )
                      with urllib.request.urlopen(req, context=CTX, timeout=15) as r:
                          code = r.status
                          body = r.read(240)
                      break
                  except urllib.error.HTTPError as e:
                      code = e.code
                      body = e.read(240)
                      break
                  except Exception as e:
                      err = str(e)
                      if attempt < 2: time.sleep(3); continue
              if code is None:
                  print(f"  [FAIL] {path} -> {err}"); failures.append(path); return
              expected = expect if isinstance(expect, (list, tuple)) else [expect]
              ok = code in expected
              print(f"  [{'PASS' if ok else 'FAIL'}] {path} <- HTTP {code}")
              if not ok:
                  failures.append(f"{path} (got {code}, expected {expected})")
                  return
              if path.startswith("/api") and body.lstrip()[:1] == b"<":
                  print(f"  [FAIL] {path} returned HTML instead of JSON")
                  failures.append(f"{path} HTML body")

          print("\n=== SRP SmartRecruit HTTPS E2E ===")
          get("/health",                200)
          get("/",                      [200, 307, 308])
          get("/login",                 [200, 307, 308])
          get("/signup",                [200, 307, 308])
          get("/api/auth/csrf",         200)
          get("/api/auth/providers",    200)
          get("/api/auth/me",           [400, 401, 403, 405])
          get("/api/health",            200)
          get("/api/parse",             200)
          get("/api/jobs",              [401, 403])
          get("/api/jd",                [401, 403])
          # Legacy FastAPI paths may 404 when nginx routes /api to Next.js
          get("/api/resume/list",       [401, 403, 404, 405])
          get("/api/support/tickets",   [401, 403, 404, 405])
          get("/api/screening/results", [401, 403, 404, 405])

          print(f"\n{'╬ô┬ú├á All checks passed!' if not failures else '╬ô┬Ñ├« FAILED: ' + str(failures)}")
          sys.exit(1 if failures else 0)
          PYEOF
