<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Resume AI processing flow</title>
  <desc id="desc">Flow from resume upload through parsing, matching, and shortlist preparation</desc>
  <rect width="560" height="400" rx="24" fill="#050810"/>
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <path d="M80 200 H480" stroke="url(#flowGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <g transform="translate(48,160)">
    <rect width="80" height="80" rx="16" fill="#0f1628" stroke="#22d3ee" stroke-opacity="0.4"/>
    <rect x="20" y="18" width="40" height="50" rx="4" fill="rgba(34,211,238,0.2)"/>
    <text x="40" y="72" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui">Upload</text>
  </g>
  <g transform="translate(168,160)">
    <rect width="80" height="80" rx="16" fill="#0f1628" stroke="#22d3ee" stroke-opacity="0.3"/>
    <rect x="18" y="22" width="44" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>
    <rect x="18" y="34" width="36" height="6" rx="2" fill="rgba(255,255,255,0.12)"/>
    <rect x="18" y="46" width="40" height="6" rx="2" fill="rgba(255,255,255,0.12)"/>
    <text x="40" y="72" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui">Parse</text>
  </g>
  <g transform="translate(288,160)">
    <rect width="80" height="80" rx="16" fill="#0f1628" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <circle cx="40" cy="38" r="18" stroke="#8b5cf6" stroke-width="3" fill="none"/>
    <text x="40" y="42" text-anchor="middle" fill="#8b5cf6" font-size="10" font-family="system-ui">AI</text>
    <text x="40" y="72" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui">Match</text>
  </g>
  <g transform="translate(408,160)">
    <rect width="80" height="80" rx="16" fill="#0f1628" stroke="#34d399" stroke-opacity="0.4"/>
    <rect x="16" y="24" width="48" height="32" rx="6" fill="rgba(52,211,153,0.15)"/>
    <text x="40" y="72" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui">Shortlist</text>
  </g>
</svg>
