<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Agency recruitment operations room</title>
  <desc id="d">Dashboard showing high CV volume, urgent deadlines, and scattered candidate notes</desc>
  <rect width="800" height="500" fill="#020308"/>
  <rect x="40" y="40" width="200" height="120" rx="12" fill="#0f1628" stroke="rgba(239,68,68,0.4)"/>
  <text x="60" y="80" fill="#f87171" font-size="28" font-weight="700" font-family="system-ui">500</text>
  <text x="60" y="105" fill="#94a3b8" font-size="12" font-family="system-ui">CVs for one role</text>
  <rect x="280" y="60" width="180" height="80" rx="10" fill="#0f1628" stroke="rgba(251,191,36,0.35)"/>
  <text x="300" y="95" fill="#fbbf24" font-size="11" font-family="system-ui">Client deadline: 48h</text>
  <rect x="500" y="50" width="260" height="100" rx="12" fill="#0f1628" stroke="rgba(139,92,246,0.3)"/>
  <text x="520" y="85" fill="#c4b5fd" font-size="11" font-family="system-ui">Duplicate profile detected</text>
  <rect x="520" y="100" width="120" height="8" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="60" y="200" width="680" height="240" rx="16" fill="#0a0f1c" stroke="rgba(34,211,238,0.2)"/>
  <rect x="90" y="230" width="140" height="60" rx="8" fill="rgba(34,211,238,0.08)"/>
  <rect x="250" y="230" width="140" height="60" rx="8" fill="rgba(139,92,246,0.08)"/>
  <rect x="410" y="230" width="140" height="60" rx="8" fill="rgba(255,255,255,0.04)"/>
  <rect x="90" y="320" width="600" height="8" rx="2" fill="rgba(255,255,255,0.06)"/>
  <rect x="90" y="340" width="400" height="8" rx="2" fill="rgba(255,255,255,0.04)"/>
</svg>
